<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#03c75a" />
  <title>수어 번역기</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>수어 번역기</h1>
    </header>

    <nav class="modes" role="tablist" aria-label="번역 모드">
      <button id="mode-t2s" class="mode active" aria-selected="true">텍스트 → 수어</button>
      <button id="mode-s2t" class="mode" aria-selected="false">수어 → 텍스트</button>
    </nav>

    <section class="io">
      <label class="visually-hidden" for="input">번역할 텍스트</label>
      <textarea id="input" placeholder="번역할 말을 입력하세요 (예: 안녕하세요)"></textarea>
      <button id="translate" class="btn-primary">번역</button>
    </section>

    <section id="result" class="result" aria-live="polite">
      <p class="hint">번역할 말을 입력하면 바로 표시돼요.</p>
    </section>

    <!-- Phase 2 (수어→텍스트): 카메라 + 손 랜드마크 검출 스캐폴드 -->
    <section id="camera" class="camera" hidden>
      <div class="cam-wrap">
        <video id="cam" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="ref-box" class="ref-box" hidden><img alt="참고 손모양"></div>
      </div>
      <p id="sign-out" class="sign-out" aria-live="polite">—</p>
      <p id="text-out" class="text-out" aria-live="polite">…</p>
      <div class="cam-controls">
        <button id="btn-space">스페이스</button>
        <button id="btn-del">지우기</button>
        <button id="btn-clear">전체지우기</button>
      </div>
      <p id="cam-status" class="status">카메라 준비 중…</p>
      <p class="hint">손모양을 6프레임 유지하면 자모 확정 → 한글 조합. 같은 자모 연속은 손을 내렸다 다시.</p>
      <details class="knn-train">
        <summary>자모 직접 가르치기 (KNN 학습)</summary>
        <p class="hint">인식할 자모를 입력하고, 그 손모양을 카메라에 비춘 채 "녹화"를 여러 번(자모당 5~10회) 눌러 샘플을 모으세요. 샘플이 쌓이면 규칙 대신 KNN이 인식합니다.</p>
        <div class="cam-controls">
          <input id="train-label" maxlength="1" placeholder="자모 (예: ㅏ)" />
          <button id="btn-record">이 손모양 녹화</button>
          <span id="sample-count" class="status"></span>
          <button id="btn-reset-samples">샘플 초기화</button>
        </div>
      </details>
    </section>

    <p id="status" class="status"></p>
    <footer class="credit">
      지화 이미지: <a href="https://commons.wikimedia.org/wiki/Category:Korean_manual_alphabet" target="_blank" rel="noopener">Wikimedia Commons</a>
      (Kwamikagami), <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>
    </footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
