<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>시안 ↔ 실제 앱 대조</title>
<style>
  body { margin:0; padding:24px; background:#E7DDD5; font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p  { font-size:13px; color:#6B5D57; margin:0 0 20px; }
  .row { display:flex; gap:24px; justify-content:center; align-items:flex-start; }
  .col { text-align:center; }
  .cap { font-size:12px; font-weight:700; color:#6B5D57; margin-top:8px; }
  .phone {
    width:390px; height:700px; border:8px solid #1C1614; border-radius:38px;
    overflow:hidden; box-shadow:0 20px 40px rgba(80,50,40,.25); background:#FFF7F0;
  }
  .phone iframe { width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
  <h1>시안 ↔ 실제 앱</h1>
  <p>왼쪽이 시안(mockup.html의 사전 화면), 오른쪽이 실제 앱(index.html). 같은 폭·같은 프레임.</p>
  <div class="row">
    <div class="col">
      <div class="phone"><iframe src="mockup-dict.html"></iframe></div>
      <div class="cap">시안</div>
    </div>
    <div class="col">
      <div class="phone"><iframe src="../index.html?cmp=1"></iframe></div>
      <div class="cap">실제 앱</div>
    </div>
  </div>
</body>
</html>
