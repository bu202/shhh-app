<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 — 사전 화면</title>
<style>
/* mockup.html 의 사전 화면만 떼어낸 것. 대조용이라 값은 손대지 않는다. */
:root{
  --ink:#241C1A; --sub:#6B5D57; --muted:#A0938D;
  --cream:#FFF7F0; --paper:#fff; --line:#F0E4DA;
  --coral:#FF6B5B; --coral-d:#E85445; --peach:#FFE3D5;
  --lilac:#B9A9FF; --lilac-s:#EFEAFF; --lilac-d:#5A46C4;
  --mint:#7FD8B0; --mint-s:#E3F7EE; --mint-d:#1D8A5F;
  --r-card:26px; --r-btn:18px;
  --sh:0 8px 24px rgba(120,80,64,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
.screen{flex:1;display:flex;flex-direction:column;padding:6px 16px 0;gap:10px;overflow:hidden}

.row{display:flex;align-items:center;gap:10px}
.hi{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.hi small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:0}
.mascot{width:44px;height:44px;flex:0 0 auto}

.search{background:var(--paper);border-radius:18px;padding:12px 14px;font-size:13px;
  box-shadow:var(--sh);display:flex;align-items:center;gap:8px;font-weight:600}

.note{background:var(--mint-s);border-radius:16px;padding:11px 13px;font-size:10.5px;
  line-height:1.6;color:#356B57}
.note b{color:var(--mint-d);display:block;margin-bottom:3px;font-size:11.5px}

.res{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.res .c{background:var(--peach);border-radius:18px;padding:10px;text-align:center;
  box-shadow:0 3px 10px rgba(120,80,64,.06)}
.res .c img{width:100%;height:74px;object-fit:contain;mix-blend-mode:multiply;filter:contrast(1.06)}
.res .c b{display:block;font-size:12.5px;margin-top:4px}
.res .c span{font-size:9px;color:#8A6A5C;display:block;margin-top:1px;line-height:1.5}

.locked{border:2px dashed var(--lilac);background:var(--lilac-s);border-radius:20px;
  padding:11px;text-align:center;margin-top:auto;margin-bottom:8px}
.locked .t{font-size:12px;font-weight:900;color:var(--lilac-d)}
.btn{border:none;border-radius:var(--r-btn);padding:9px;font-size:12px;font-weight:800;
  font-family:inherit;width:100%;cursor:pointer;letter-spacing:-.01em;margin-top:8px;
  background:var(--coral);color:#fff;box-shadow:0 6px 14px rgba(255,107,91,.35)}

.tabs{display:flex;justify-content:space-around;padding:9px 4px 14px;background:var(--paper);
  border-top:1px solid var(--line);margin:auto -16px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:700;color:var(--muted)}
.tab i{font-style:normal;font-size:17px;filter:grayscale(1);opacity:.45}
.tab.on{color:var(--coral)} .tab.on i{filter:none;opacity:1}
</style>
</head>
<body>
  <div class="screen">
    <div class="row" style="padding-top:6px">
      <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="46" r="33" fill="#FFE3D5"/>
        <circle cx="37" cy="40" r="4" fill="#241C1A"/><circle cx="63" cy="40" r="4" fill="#241C1A"/>
        <ellipse cx="28" cy="52" rx="6.5" ry="4" fill="#FF6B5B" opacity=".4"/>
        <ellipse cx="72" cy="52" rx="6.5" ry="4" fill="#FF6B5B" opacity=".4"/>
        <g transform="rotate(-16 50 60)">
          <rect x="45" y="44" width="11" height="27" rx="5.5" fill="#FFF7F0" stroke="#241C1A" stroke-width="3.2"/>
          <rect x="29" y="64" width="33" height="22" rx="11" fill="#FFF7F0" stroke="#241C1A" stroke-width="3.2"/>
        </g>
      </svg>
      <div class="hi">사전<small>12,943개 단어를 손으로</small></div>
    </div>

    <div class="search"><span>🔍</span><span>보고싶어</span></div>

    <div class="note">
      <b>두 수어를 이어서 표현해요</b>
      '보고싶다'는 하나의 손짓이 아니라 <b style="display:inline">보다 + 원하다</b>입니다.
      어미 '-어'는 수어에 없어서 떼고 찾았어요.
    </div>

    <div class="res">
      <div class="c">
        <img src="https://sldict.korean.go.kr/multimedia/multimedia_files/convert/20151222/232640/IMG000227011_700X466.jpg" alt="보다 수어">
        <b>① 보다</b><span>검지손가락을 펴서 바닥이 안으로 향하게 세운 두 주먹을 상하로 엇갈리게</span>
      </div>
      <div class="c">
        <img src="https://sldict.korean.go.kr/multimedia/multimedia_files/convert/20151117/211586/IMG000201931_700X466.jpg" alt="원하다 수어">
        <b>② 원하다</b><span>검지·엄지손가락 끝 바닥을 목에 댔다가 밖으로 내밀면서</span>
      </div>
    </div>

    <div class="locked">
      <div class="t">찾은 단어를 우리 단어장에</div>
      <button class="btn">단어장에 담기</button>
    </div>

    <div class="tabs">
      <div class="tab"><i>🏠</i>홈</div>
      <div class="tab on"><i>🔤</i>사전</div>
      <div class="tab"><i>💌</i>우리</div>
      <div class="tab"><i>🎯</i>연습</div>
    </div>
  </div>
</body>
</html>
