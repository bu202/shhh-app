# 검사만 한다. **배포는 여기서 하지 않는다** — 배포는 사람이 승인하고 사람이 누른다
# (`docs/SECURITY_RELEASE_CHECKLIST.md` 의 배포 절차).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 앱은 의존성이 0이지만 scripts/ 가 devDependency 를 쓴다.
      - run: npm ci

      # 문법부터. 여기서 깨지면 아래 검사들이 엉뚱한 이유로 실패해 원인을 가린다.
      - name: syntax
        run: |
          for f in js/*.js worker/index.js functions/api/*.js service-worker.js; do
            node --check "$f"
          done

      - run: npm test
      - run: npm audit --audit-level=high

      # dist/ 에 내부 파일이 없는지. npm test 안의 test-dist 가 이미 재지만,
      # **빌드 산출물이 실제로 만들어지는지**를 따로 남겨 둔다(빌드가 죽으면 배포도 죽는다).
      - run: npm run build
      - name: dist 에 내부 파일이 없는지 다시 확인
        run: |
          set -e
          bad=$(find dist -type f \( -name '*.md' -o -name '*.mjs' -o -name '*.py' \
                -o -name 'package*.json' -o -name 'wrangler*' -o -name '.env*' \) -print)
          if [ -n "$bad" ]; then echo "배포 산출물에 내부 파일이 있다:"; echo "$bad"; exit 1; fi
          for d in worker functions scripts docs design brand; do
            if [ -e "dist/$d" ]; then echo "dist/$d 가 있다"; exit 1; fi
          done
          echo "dist/ 깨끗함 ($(find dist -type f | wc -l) 파일)"
